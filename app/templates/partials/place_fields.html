{% set item = current if current is defined else none %}
<div class="field-group"><label>Название</label><input name="name" value="{{ item.name if item else '' }}" placeholder="Дом" required></div>
<div class="field-group"><label>Адрес</label><input name="address" value="{{ item.address or '' if item else '' }}" placeholder="Улица и дом"></div>
<div class="coordinate-row">
  <div class="field-group"><label>Широта</label><input name="latitude" inputmode="decimal" value="{{ item.latitude if item and item.latitude is not none else '' }}" placeholder="55.7512"></div>
  <div class="field-group"><label>Долгота</label><input name="longitude" inputmode="decimal" value="{{ item.longitude if item and item.longitude is not none else '' }}" placeholder="37.6184"></div>
</div>
<button class="map-pick-button" type="button" data-map-pick>Указать на карте</button>
<div class="field-group"><label>Описание</label><textarea name="description" rows="3" placeholder="Ориентир или заметка">{{ item.description or '' if item else '' }}</textarea></div>
<label class="color-field">Цвет метки <input name="marker_color" type="color" value="{{ item.marker_color if item else '#111111' }}"></label>
