<button class="map-place-editor" id="map-place-{{ place.id }}" type="button" data-map-edit-place="{{ place.id }}" aria-label="Редактировать место {{ place.name }}">
  <i style="--marker: {{ place.marker_color }}"></i>
  <span><strong>{{ place.name }}</strong><small>{{ place.description or ('Точка указана' if place.latitude is not none and place.longitude is not none else 'Нужна точка') }}</small></span>
  <span class="material-symbols-rounded ui-chevron" aria-hidden="true">chevron_right</span>
</button>
