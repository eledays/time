{% extends "base.html" %}
{% block title %}Карта{% endblock %}
{% block page %}map{% endblock %}
{% block content %}
<main class="map-page">
  <div class="map-heading"><h1>Карта</h1>{% if not map_data.places %}<p>Добавьте координаты в «Местах»</p>{% endif %}</div>
  <div id="journey-map" class="journey-map" aria-label="Карта сохранённых мест"></div>
  <script id="map-data" type="application/json">{{ map_data|tojson }}</script>
</main>
{% endblock %}
{% block head %}<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">{% endblock %}
{% block scripts %}<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>{% endblock %}
