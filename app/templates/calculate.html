{% extends "base.html" %}
{% block title %}Рассчитать маршрут{% endblock %}
{% block page %}calculate{% endblock %}
{% block content %}
<main class="page-shell calculate-page">
  <section class="calculator-head">
    <h1>Как добраться?</h1>
  </section>
  <section class="calculator-grid">
    <form class="route-builder" method="get" action="{{ url_for('main.calculate_result') }}">
      <div class="route-endpoints">
        <div class="point-row autocomplete">
          <span class="endpoint-dot" aria-hidden="true"></span>
          <div class="endpoint-field">
            <input id="route-origin" name="origin" type="text" maxlength="{{ config.MAX_TEXT_LENGTH }}" autocomplete="off" required data-place-input>
            <label for="route-origin">Откуда</label>
            <div class="suggestions" role="listbox"></div>
          </div>
        </div>
        <div class="endpoint-connector" aria-hidden="true"></div>
        <div class="point-row autocomplete">
          <span class="endpoint-dot endpoint-dot-finish" aria-hidden="true"></span>
          <div class="endpoint-field">
            <input id="route-destination" name="destination" type="text" maxlength="{{ config.MAX_TEXT_LENGTH }}" autocomplete="off" required data-place-input>
            <label for="route-destination">Куда</label>
            <div class="suggestions" role="listbox"></div>
          </div>
        </div>
      </div>
      <button type="submit" class="primary-button calculate-button">Рассчитать</button>
    </form>
  </section>
</main>
{% endblock %}
