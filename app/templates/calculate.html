{% extends "base.html" %}
{% block title %}Посчитать маршрут · Ход{% endblock %}
{% block page %}calculate{% endblock %}
{% block content %}
<main class="page-shell calculate-page">
  <section class="calculator-head">
    <h1>Сколько ехать?</h1>
  </section>
  <section class="calculator-grid">
    <form class="route-builder" data-calculator>
      <input type="hidden" data-csrf value="{{ csrf_token() }}">
      <div class="points" data-points>
        <div class="point-row autocomplete"><span class="point-index">01</span><input type="text" placeholder="Откуда" autocomplete="off" required data-place-input><div class="suggestions" role="listbox"></div><button type="button" class="remove-point" aria-label="Удалить точку">×</button></div>
        <div class="point-row autocomplete"><span class="point-index">02</span><input type="text" placeholder="Куда" autocomplete="off" required data-place-input><div class="suggestions" role="listbox"></div><button type="button" class="remove-point" aria-label="Удалить точку">×</button></div>
      </div>
      <button type="button" class="add-point" data-add-point><span>+</span> Добавить точку</button>
      <button type="submit" class="primary-button calculate-button">Посчитать</button>
    </form>
    <div class="result-panel" data-result aria-live="polite">
      <div class="result-placeholder"><p>Здесь появится расчёт</p></div>
    </div>
  </section>
</main>
{% endblock %}
