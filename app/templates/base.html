<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090909">
    <meta name="description" content="Личный дневник времени в пути">
    <title>{% block title %}Ход{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
  </head>
  <body data-page="{% block page %}base{% endblock %}">
    <div class="ambient" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="{{ url_for('main.index') }}" aria-label="Ход, на главную">
        <span class="brand-mark">Х</span><span>Ход</span>
      </a>
      {% if g.user %}
        <nav class="nav" aria-label="Основная навигация">
          <a class="nav-link {{ 'active' if request.endpoint == 'main.index' }}" href="{{ url_for('main.index') }}">Записать</a>
          <a class="nav-link {{ 'active' if request.endpoint == 'main.calculate' }}" href="{{ url_for('main.calculate') }}">Посчитать</a>
        </nav>
        <form action="{{ url_for('auth.logout') }}" method="post" class="profile-form">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="profile" type="submit" title="Выйти">
            {% if g.user.avatar_url %}<img src="{{ g.user.avatar_url }}" alt="">{% else %}<span>{{ g.user.display_name[:1] }}</span>{% endif %}
            <span class="profile-name">{{ g.user.display_name }}</span>
          </button>
        </form>
      {% endif %}
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="toast-stack" aria-live="polite">
          {% for category, message in messages %}<div class="toast {{ category }}">{{ message }}</div>{% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </body>
</html>
